apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay
  namespace: finsecure
  labels:
    app.kubernetes.io/name: finsecure-pay
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: finsecure-pay
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay-management
  namespace: finsecure
  labels:
    app.kubernetes.io/name: finsecure-pay
    app.kubernetes.io/component: management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finsecure-pay
  ports:
    - name: management
      port: 8081
      targetPort: management
