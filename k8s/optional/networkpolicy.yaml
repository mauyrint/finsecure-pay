apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finsecure-pay-ingress
  namespace: finsecure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finsecure-pay
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8081
          protocol: TCP
