# EXAMPLE ONLY - DO NOT put real values in Git.
# The real Secret is created by the Jenkins "Deploy" stage from the Jenkins credential
# `finsecure-api-key`:
#   kubectl -n finsecure create secret generic finsecure-pay-secrets \
#     --from-literal=FINSECURE_SECURITY_API_KEY="$API_KEY" --dry-run=client -o yaml | kubectl apply -f -
# EKS envelope-encrypts Secrets at rest with AWS KMS (see infra/eks/cluster.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: finsecure-pay-secrets
  namespace: finsecure
type: Opaque
stringData:
  FINSECURE_SECURITY_API_KEY: "<set-by-jenkins>"
